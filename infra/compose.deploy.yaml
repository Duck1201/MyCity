name: mycity

services:
    db:
        image: postgres:17.7-alpine
        environment:
            POSTGRES_DB: mycity
            POSTGRES_USER: mycity
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a senha no servidor}
        volumes:
            - database:/var/lib/postgresql/data
        healthcheck:
            test: [CMD-SHELL, pg_isready -U mycity -d mycity]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
    migrate:
        image: ghcr.io/duck1201/mycity-tools:sha-${RELEASE_SHA:?Release obrigatória}
        profiles: [tools]
        environment:
            DATABASE_URL: postgresql://mycity:${POSTGRES_PASSWORD}@db:5432/mycity
        command: [npm, run, db:migrate]
        depends_on:
            db:
                condition: service_healthy
    seed:
        extends: migrate
        environment:
            DEMO_PASSWORD: ${DEMO_PASSWORD:?Configure a senha de demonstração no servidor}
        command: [npm, run, db:seed]
    api:
        image: ghcr.io/duck1201/mycity-api:sha-${RELEASE_SHA:?Release obrigatória}
        environment:
            NODE_ENV: production
            NODE_OPTIONS: --max-old-space-size=256
            PORT: 3000
            DATABASE_URL: postgresql://mycity:${POSTGRES_PASSWORD}@db:5432/mycity
            UPLOAD_DIR: /app/uploads
        volumes:
            - photos:/app/uploads
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
    web:
        image: ghcr.io/duck1201/mycity-web:sha-${RELEASE_SHA:?Release obrigatória}
        ports:
            - 127.0.0.1:8090:80
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped
    edge:
        image: caddy:2.10-alpine
        ports:
            - 8080:8080
        volumes:
            - ./Caddyfile.deploy:/etc/caddy/Caddyfile:ro
            - certificates:/data
            - edge-config:/config
        networks:
            default:
            existing-proxy:
                aliases: [mycity-edge]
        depends_on: [web]
        extra_hosts:
            - mycity.private-gateway.site:127.0.0.1
        healthcheck:
            test: [CMD, wget, -q, -O, /dev/null, 'https://mycity.private-gateway.site:8080/api/v1/health/ready']
            interval: 5s
            timeout: 5s
            start_period: 30s
            retries: 18
        restart: unless-stopped

networks:
    existing-proxy:
        external: true
        name: kim-activity_stream-net

volumes:
    database:
    photos:
    certificates:
    edge-config:
