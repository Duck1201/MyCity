map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
}

log_format mycity '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent upstream_status=$upstream_status request_time=$request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  access_log /var/log/nginx/access.log mycity;
  location /api/ {
    # The built-in upstream error message includes the original request URL.
    error_log /dev/null;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
