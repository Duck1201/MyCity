name: mycity

services:
    db:
        image: postgres:17.7-alpine
        environment:
            POSTGRES_DB: mycity
            POSTGRES_USER: mycity
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a senha no servidor}
        volumes:
            - database:/var/lib/postgresql/data
        healthcheck:
            test: [CMD-SHELL, pg_isready -U mycity -d mycity]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
    provision:
        image: postgres:17.7-alpine
        profiles: [tools]
        environment:
            PGHOST: db
            PGDATABASE: mycity
            PGUSER: mycity
            PGPASSWORD: ${POSTGRES_PASSWORD:?Configure a senha no servidor}
            API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Configure a senha exclusiva da API}
        volumes:
            - ./provision-api.sql:/provision-api.sql:ro
        entrypoint: [sh, -ec]
        command:
            - |
                case "$${API_DATABASE_PASSWORD}" in *[!a-zA-Z0-9_-]*) exit 2 ;; esac
                test "$${API_DATABASE_PASSWORD}" != "$${PGPASSWORD}"
                printf '%s\n' "$${API_DATABASE_PASSWORD}" "$${API_DATABASE_PASSWORD}" | psql -Xw -v ON_ERROR_STOP=1 -f /provision-api.sql
    migrate:
        image: ghcr.io/duck1201/mycity-tools@${TOOLS_DIGEST:?Digest obrigatório}
        profiles: [tools]
        environment:
            DATABASE_URL: postgresql://mycity:${POSTGRES_PASSWORD}@db:5432/mycity
        command: [npm, run, db:migrate]
        depends_on:
            db:
                condition: service_healthy
    seed:
        extends: migrate
        volumes:
            - photos:/app/uploads
        environment:
            UPLOAD_DIR: /app/uploads
            DEMO_CITIZEN_A_PASSWORD: ${DEMO_CITIZEN_A_PASSWORD:-}
            DEMO_CITIZEN_B_PASSWORD: ${DEMO_CITIZEN_B_PASSWORD:-}
            DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
        command: [npm, run, db:seed]
    thumbnails:
        extends: migrate
        volumes:
            - photos:/app/uploads
        environment:
            UPLOAD_DIR: /app/uploads
        command: [npm, run, photos:backfill-thumbnails, -w, '@mycity/api']
    api:
        image: ghcr.io/duck1201/mycity-api@${API_DIGEST:?Digest obrigatório}
        environment:
            WEB_ORIGIN: ${WEB_ORIGIN:?Configure WEB_ORIGIN no .env.production do servidor}
            PROXY_HOPS: '2'
            NODE_ENV: production
            NODE_OPTIONS: --max-old-space-size=256
            PORT: 3000
            DATABASE_URL: postgresql://mycity_api:${API_DATABASE_PASSWORD:?Configure a senha exclusiva da API}@db:5432/mycity
            UPLOAD_DIR: /app/uploads
        volumes:
            - photos:/app/uploads
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
    web:
        image: ghcr.io/duck1201/mycity-web@${WEB_DIGEST:?Digest obrigatório}
        ports:
            - 127.0.0.1:8090:80
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped
    edge:
        init: true
        image: caddy:2.10-alpine
        environment:
            WEB_ORIGIN: ${WEB_ORIGIN:?Configure WEB_ORIGIN no .env.production do servidor}
        ports:
            - ${EDGE_PORT:-443}:${EDGE_PORT:-443}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - certificates:/data
            - edge-config:/config
        depends_on: [web]
        extra_hosts:
            - ${PUBLIC_HOST:?Configure PUBLIC_HOST no .env.production do servidor}:127.0.0.1
        healthcheck:
            test: [CMD-SHELL, 'wget -q -O /dev/null "$$WEB_ORIGIN/api/v1/health/ready"']
            interval: 5s
            timeout: 5s
            start_period: 30s
            retries: 18
        restart: unless-stopped

volumes:
    database:
    photos:
    certificates:
    edge-config:
