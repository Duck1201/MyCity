name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, edited]
    workflow_dispatch:

permissions:
    contents: read

env:
    DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    security:
        name: Security checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: .nvmrc
            - run: npm run security:secrets
            - run: npm run security:dependencies

    commits:
        name: Conventional Commits
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: .nvmrc
            - run: node scripts/check-commits.mjs
              env:
                  COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}

    checks:
        name: Quality checks
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17.7-alpine
                env:
                    POSTGRES_USER: mycity_test
                    POSTGRES_PASSWORD: local_test_only
                    POSTGRES_DB: mycity_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mycity_test -d mycity_test"
                    --health-interval 5s --health-timeout 3s --health-retries 10
        env:
            TEST_DATABASE_URL: postgresql://mycity_test:local_test_only@127.0.0.1:5432/mycity_test
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run db:generate -w @mycity/api
            - run: npm run format:check
            - run: npm run check
            - run: npm run export:android -w @mycity/mobile

    containers:
        name: Container builds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  target: runtime
                  push: false
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: false
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  target: build
                  push: false
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=tools
