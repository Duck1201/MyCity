name: Deploy

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy-demonstration
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to EC2
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: demonstration
            url: https://mycity.private-gateway.site:8080
        permissions:
            contents: read
            packages: read
            actions: read
        env:
            RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
            CI_RUN: ${{ github.event.workflow_run.id }}
            CI_NUMBER: ${{ github.event.workflow_run.run_number }}
            CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_USER: ${{ vars.DEPLOY_USER }}
            DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false
            - name: Retrieve release digests from the successful CI run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  [[ "$CI_NUMBER" =~ ^[1-9][0-9]{0,14}$ && "$CI_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
                  [[ "$RELEASE_SHA" == "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" ]]
                  printf 'RELEASE_SHA=%s\nCI_NUMBER=%s\nCI_ATTEMPT=%s\n' "$RELEASE_SHA" "$CI_NUMBER" "$CI_ATTEMPT" > images.env
                  for image in api tools web; do
                    gh run download "$CI_RUN" -n "digest-$CI_ATTEMPT-$image" -D "$RUNNER_TEMP/$image"
                    read -r sha number attempt label digest < "$RUNNER_TEMP/$image/$image.digest"
                    [[ "$sha $number $attempt $label" == "$RELEASE_SHA $CI_NUMBER $CI_ATTEMPT $image" && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
                    printf '%s_DIGEST=%s\n' "${image^^}" "$digest" >> images.env
                  done
            - name: Prepare SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
                  [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
                  [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
                  [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9/_-]+$ ]]
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
            - name: Transfer release configuration
              run: |
                  set -euo pipefail
                  host="$DEPLOY_USER@$DEPLOY_HOST"
                  release="$DEPLOY_DIR/releases/$RELEASE_SHA-$CI_NUMBER-$CI_ATTEMPT"
                  ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
                  incoming=$(ssh "${ssh_opts[@]}" "$host" "mkdir -p '$DEPLOY_DIR/releases' && mktemp -d '$DEPLOY_DIR/releases/incoming-XXXXXXXX'")
                  [[ "$incoming" == "$DEPLOY_DIR/releases/${incoming##*/}" && "${incoming##*/}" =~ ^incoming-[[:alnum:]]{8}$ ]]
                  trap 'ssh "${ssh_opts[@]}" "$host" "rm -rf -- \"$incoming\""' EXIT
                  scp "${ssh_opts[@]}" images.env infra/provision-api.sql infra/compose.deploy.yaml infra/Caddyfile.deploy scripts/deploy.sh scripts/deployment-env.py "$host:$incoming/"
                  ssh "${ssh_opts[@]}" "$host" "mv -T '$incoming' '$release' || diff -qr '$incoming' '$release'"
            - name: Deploy tested images
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  EC2_RUNTIME_ENV: ${{ secrets.EC2_RUNTIME_ENV }}
              run: |
                  set -euo pipefail
                  python3 scripts/deployment-env.py send | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash '$DEPLOY_DIR/releases/$RELEASE_SHA-$CI_NUMBER-$CI_ATTEMPT/deploy.sh' '$DEPLOY_DIR' '$RELEASE_SHA' '$GHCR_USER' '$CI_NUMBER' '$CI_ATTEMPT'"
            - name: Verify public HTTPS
              run: curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://mycity.private-gateway.site:8080/api/v1/health/ready
            - name: Remove runner SSH key
              if: always()
              run: rm -f ~/.ssh/id_ed25519
