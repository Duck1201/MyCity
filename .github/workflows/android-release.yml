name: Android release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        name: Build Android APK
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: demonstration
        outputs:
            artifact_id: ${{ steps.transfer.outputs.artifact-id }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: .nvmrc
            - name: Install build dependencies
              run: |
                  set -euo pipefail
                  export JAVA_HOME="$JAVA_HOME_21_X64"
                  echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm run build:contracts
            - name: Generate native Android project
              working-directory: apps/mobile
              env:
                  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
                  EXPO_NO_DOTENV: '1'
                  EXPO_NO_TELEMETRY: '1'
                  EXPO_OFFLINE: '1'
              run: |
                  set -euo pipefail
                  test -n "$GOOGLE_MAPS_ANDROID_API_KEY"
                  ../../node_modules/.bin/expo prebuild --platform android --no-install --template ../../node_modules/expo/template.tgz >/dev/null 2>&1
                  node -e "const fs=require('node:fs'); const xml=fs.readFileSync('android/app/src/main/AndroidManifest.xml','utf8'); process.exit(xml.includes(process.env.GOOGLE_MAPS_ANDROID_API_KEY) ? 0 : 1)"
            - name: Assemble release variant
              working-directory: apps/mobile/android
              env:
                  NODE_ENV: production
                  EXPO_NO_DOTENV: '1'
                  EXPO_NO_TELEMETRY: '1'
                  EXPO_PUBLIC_API_URL: https://mycity.private-gateway.site:8080/api/v1
              run: ./gradlew --no-daemon --max-workers 2 --console=plain :app:assembleRelease
            - name: Transfer APK to signing runner
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              id: transfer
              with:
                  name: android-intermediate-${{ github.run_attempt }}
                  path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
                  retention-days: 1
                  if-no-files-found: error
                  compression-level: 0

    sign:
        name: Sign Android APK
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: demonstration
        steps:
            - name: Prepare signing tools
              run: |
                  set -euo pipefail
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;37.0.0'
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  artifact-ids: ${{ needs.build.outputs.artifact_id }}
                  path: input
                  merge-multiple: true
                  digest-mismatch: error
            - name: Sign and verify APK
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
              run: |
                  set -euo pipefail
                  umask 077
                  test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
                  store=$(mktemp "$RUNNER_TEMP/mycity-signing.XXXXXXXX")
                  trap 'rm -- "$store"' EXIT
                  printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$store"
                  unset KEYSTORE_BASE64
                  tools="$ANDROID_HOME/build-tools/37.0.0"
                  mkdir release
                  "$tools/apksigner" sign --ks "$store" --ks-key-alias mycity-release --ks-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false --out release/mycity.apk input/app-release.apk
                  unset KEYSTORE_PASSWORD
                  "$tools/zipalign" -c -P 16 4 release/mycity.apk
                  "$tools/aapt" dump badging release/mycity.apk | sed -n '1p' | grep -F "package: name='br.edu.mycity.app'"
                  cert=$("$tools/apksigner" verify --print-certs release/mycity.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
                  test "$cert" = '74d59f2563cba608e433a7fd8be9817774161a89a672c61766ad89cc535f8ff4'
                  cd release
                  sha256sum mycity.apk > mycity.apk.sha256
                  sha256sum --check mycity.apk.sha256
            - name: Publish signed APK and checksum
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: mycity-android-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
                  path: |
                      release/mycity.apk
                      release/mycity.apk.sha256
                  if-no-files-found: error
                  compression-level: 0

    cleanup:
        name: Remove intermediate APK
        needs: [build, sign]
        if: always() && needs.build.outputs.artifact_id != ''
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Remove transferred artifact
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
              run: |
                  set -euo pipefail
                  [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
