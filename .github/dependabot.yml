version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
          time: '09:00'
          timezone: America/Sao_Paulo
      open-pull-requests-limit: 5
      commit-message:
          prefix: build
          include: scope
      groups:
          expo-runtime:
              patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-test-renderer', '@react-native/*', 'jest-expo', '@types/react', '@types/react-dom']
          prisma:
              patterns: ['prisma', '@prisma/*']
      # Node is pinned to 24 by engines and .nvmrc; a major upgrade is a deliberate change.
      ignore:
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      commit-message:
          prefix: build
          include: scope
    - package-ecosystem: docker
      directories: ['/', '/apps/api', '/apps/web', '/deploy']
      schedule:
          interval: monthly
      ignore:
          - dependency-name: node
            update-types: ['version-update:semver-major']
      open-pull-requests-limit: 5
      commit-message:
          prefix: build
          include: scope
